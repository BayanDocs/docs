# lychee (link checker) settings for scripts/verify.sh (work package DOCS-001).
#
# Links between files in this repository are checked strictly and offline, including #anchors, both in the Markdown (as GitHub shows it) and in the built website. External links are checked online with a cache (.lycheecache, ignored by Git, kept between CI runs) so that each external page is fetched at most about once a day.

# lychee 0.24.2 retries a request after a timeout or a dropped connection, waiting retry_wait_time seconds and then twice as long each time (2, 4 and 8 seconds). It never retries an answer with a server error status (500 to 599), so these retries do not help when a server answers that it cannot serve the page right now, with 500, 503 or 504 (see accept below).
max_retries = 3
retry_wait_time = 2
timeout = 20
max_concurrency = 16
user_agent = "lychee (BayanDocs documentation link check)"

# A "429 Too Many Requests" answer means the page exists but the site is limiting automated checks, not that the link is broken.
# "503 Service Unavailable" means that the server cannot answer right now, "504 Gateway Timeout" that a server in front of the site waited too long for it, and "500 Internal Server Error" that the server failed while answering: like a timeout (below), none of them says whether the page exists. github.com gave them for pages that exist, which failed the check on main and blocked pull requests: 503 and 504 for hours on 2026-10-10, and 500 for half an hour on 2026-10-14, for a different page on almost every attempt. A 500 can also come from a page that is broken for good; the owner chose on 2026-10-17 to accept it anyway, because the link is still listed on every run. lychee counts these answers, like 429, as OK and leaves them out of its summary, so scripts/verify.sh lists every link that got one of them; and they are never cached (cache_exclude_status below), so such a link is checked again on the next run. Every other error status still fails the check, including "502 Bad Gateway", which a proxy also gives when the site behind it is gone for good; so do a missing page (404, 410), a name that does not resolve, and a refused connection.
accept = ["100..=103", "200..=299", "429", "500", "503", "504"]
# A timeout (after the retries above) says nothing about whether a page exists: slow or rate-limiting sites cause them, while a dead site gives an error status or a connection error. Timeouts are reported but do not fail the check.
accept_timeouts = true

max_cache_age = "1d"
# Do not remember rate-limited or server-error answers; check those links again next time.
cache_exclude_status = ["429", "500..=599"]

# Allowlist for flaky sites: external links that are never checked because the site refuses automated clients even when the page exists. Keep this list short, give a reason for each entry, and re-check the links by hand in the monthly dependency session.
exclude = [
  # cppreference.com answers automated clients with "403 Forbidden".
  '^https://en\.cppreference\.com/',
]
