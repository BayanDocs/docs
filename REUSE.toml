# REUSE configuration (https://reuse.software): which license applies to which files in the BayanDocs knowledge base.
# Decision and reasons: ADR-0003 (adr/0003-licensing-and-contribution-model.md); plain-language FAQ: LICENSING.md.
# Full license texts are in LICENSES/. When several annotations match a file, the last one wins, so specific areas come after the default.
# A file's own SPDX header, if it has one, takes precedence over this file.
version = 1

# Default: documentation is CC-BY-4.0. Code snippets inside the documentation are also available under MIT-0 (LICENSING.md).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 BayanDocs contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Scripts: MIT-0, so they can be reused anywhere without conditions.
[[annotations]]
path = "scripts/**"
SPDX-FileCopyrightText = "2026 BayanDocs contributors"
SPDX-License-Identifier = "MIT-0"

# Configuration files, CI workflows and the website's Mermaid loader script: MIT-0 like the scripts, because CC BY 4.0 is meant for prose rather than code (the owner's decision of 2026-10-04, ADR-0003 History).
# .editorconfig and .gitattributes are configuration files too (work package X-001).
[[annotations]]
path = [".github/**", ".editorconfig", ".gitattributes", ".gitignore", "book.toml", "lychee.toml", "typos.toml", "site/mermaid/mermaid-init.js"]
SPDX-FileCopyrightText = "2026 BayanDocs contributors"
SPDX-License-Identifier = "MIT-0"

# Protocol specifications: Apache-2.0, so anyone can implement BayanDocs clients and integrations under any license.
# They must never copy text or code from the GPL engine or the AGPL server.
[[annotations]]
path = "specs/protocols/**"
SPDX-FileCopyrightText = "2026 BayanDocs contributors"
SPDX-License-Identifier = "Apache-2.0"

# Vendored third-party code: Mermaid 11.17.2, which draws diagrams on the website (site/mermaid/README.md).
# Mermaid is MIT; its single-file bundle also contains code from the packages listed in site/mermaid/THIRD-PARTY-NOTICES.txt (Apache-2.0: Chevrotain, inside Mermaid's parser).
# scripts/mermaid-licenses.py prints the expression below for each Mermaid release.
[[annotations]]
path = "site/mermaid/mermaid.min.js"
precedence = "override"
SPDX-FileCopyrightText = ["2014-2022 Knut Sveidqvist and Mermaid contributors", "The authors of the bundled packages listed in site/mermaid/THIRD-PARTY-NOTICES.txt"]
SPDX-License-Identifier = "MIT AND ISC AND BSD-3-Clause AND Apache-2.0 AND (MPL-2.0 OR Apache-2.0)"

# The Code of Conduct is the Contributor Covenant 2.1, copied verbatim from https://www.contributor-covenant.org/version/2/1/code_of_conduct/code_of_conduct.md (work package X-001). The Contributor Covenant project released version 2.1 under CC BY 4.0.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "2014 Coraline Ada Ehmke and the Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"
